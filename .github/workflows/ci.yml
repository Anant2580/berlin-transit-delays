# Runs on every push and pull request: lint the code, then test it against a real PostgreSQL 16.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: transit
          POSTGRES_DB: transit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transit -d transit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://transit:transit@localhost:5432/transit_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test (parsing, upsert logic, view, KPI queries)
        run: pytest -v
