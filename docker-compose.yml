x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-}@db:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
  AIRFLOW__API_AUTH__JWT_ISSUER: airflow
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Berlin
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  # Used by the DAGs: the transit database and the mounted collector code / SQL files
  DATABASE_URL: postgresql://${POSTGRES_USER:-transit}:${POSTGRES_PASSWORD:-transit}@db:5432/${POSTGRES_DB:-transit}
  COLLECTOR_DIR: /opt/airflow/collector
  STATIONS_FILE: /opt/airflow/collector/stations.txt
  STATIONS_CACHE: /tmp/stations.cache.json
  SQL_DIR: /opt/airflow/sql
  OWN_API_BASE: http://vbb-api:3000      # our own VBB API instance (experiment, DAG compare_apis)

x-airflow-common: &airflow-common
  build: ./airflow
  image: berlin-transit-airflow:3.3.2
  profiles: ["airflow"]
  restart: unless-stopped
  environment: *airflow-env
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./collector:/opt/airflow/collector:ro
    - ./sql:/opt/airflow/sql:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transit}
      POSTGRES_USER: ${POSTGRES_USER:-transit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit}
      TZ: Europe/Berlin
    ports:
      # Only reachable from this machine (DBeaver, Tableau, psql, Python on localhost).
      # On a cloud server, connect through an SSH tunnel instead of opening the port to the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data          # data survives restarts
      - ./db/init:/docker-entrypoint-initdb.d:ro  # creates tables on first start
      - ./sql:/sql:ro                              # KPI queries, run with psql -f
      - ./exports:/exports                         # CSV exports for Tableau / Excel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transit} -d ${POSTGRES_DB:-transit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Standalone collector (a Python loop). Used locally; on the server Airflow runs the
  # collection instead (profile "airflow"), so only one of the two collects at a time.
  collector:
    build: ./collector
    profiles: ["collector"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transit}:${POSTGRES_PASSWORD:-transit}@db:5432/${POSTGRES_DB:-transit}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      LOOKAHEAD_MINUTES: ${LOOKAHEAD_MINUTES:-10}
      STATIONS_FILE: /app/stations.txt

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Read-only database user created by db/migrations/003_dashboard_role.sql
      DATABASE_URL: postgresql://dashboard:${DASHBOARD_DB_PASSWORD:-}@db:5432/${POSTGRES_DB:-transit}
    ports:
      - "127.0.0.1:8501:8501"   # http://localhost:8501 on this machine

  # Public HTTPS for the dashboard. Only runs on the cloud server (COMPOSE_PROFILES=public in .env).
  caddy:
    image: caddy:2
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - dashboard
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Our own instance of the open-source VBB API (github.com/derhuerst/vbb-rest, ISC license),
  # the same code as the public server v6.vbb.transport.rest. The public server is shared by
  # many users and often times out; this one asks the VBB backend only for our requests.
  # Experiment for now: the DAG compare_apis measures both. Only reachable inside Docker.
  vbb-api:
    build: https://github.com/derhuerst/vbb-rest.git#6.0.7   # pinned release, built from source
    image: vbb-rest:6.0.7
    profiles: ["airflow", "own-api"]
    restart: unless-stopped
    environment:
      HOSTNAME: vbb-api
      PORT: 3000

  # ---------------------------------------------------------------------------
  # Apache Airflow (profile "airflow"): schedules the collection every 5 minutes and the
  # nightly data-quality checks and statistics. Lean setup for a small server:
  # LocalExecutor (tasks run inside the scheduler), no Redis or Celery workers,
  # metadata in its own "airflow" database on the existing PostgreSQL.
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    command: version          # the image entrypoint migrates the DB and creates the admin user first
    restart: "no"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"   # web UI only on the server itself: open it through an SSH tunnel
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  airflow_logs:
